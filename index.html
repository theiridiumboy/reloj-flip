IMPECCABLE DIRECTION CONTRACT (v2, promovido a producción 2026-08-06)
THESIS: pizarra split-flap de aeropuerto real, tarjeta color cartulina cálida, fiel al vector de referencia (Freepik "realistic scoreboard alphabet") en marco y bisagra: una tarjeta por carácter, dos caras reales que giran 180°, sombra 3D real.
OWN-WORLD: tarjetas cartulina (#f7f4ee→#e5e0d5), marco y bisagra negros sin cambios, dígitos negros salvo el "3" que va en rojo LaPatilla (#ff0400), banner de fondo blanco.
STORY: el lector entiende, de un vistazo, cuánto tiempo lleva activa la mesa de diálogo en Venezuela, y puede tocar el banner completo para leer la cobertura en LaPatilla.com.
FIRST VIEWPORT: banner único 980x200 (responsive, escala proporcional), título alineado a la izquierda, 9 tarjetas flip (3 Días + 2 Horas + 2 Minutos + 2 Segundos) en fila, labels debajo de cada grupo, banner entero clickeable.
FORM: mecanismo de tarjeta de dos caras (no revela una capa estática), promovido desde experiments/flip-v2-realista.html tras aprobación explícita de Rory.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mesa de Diálogo — Tiempo en curso</title>
<style>
  :root{
    --bg: #ffffff;
    --card-hi: #f7f4ee;
    --card-lo: #e5e0d5;
    --frame: #050505;
    --ink: #111111;
    --label: #5a5a5a;
    --tab-hi: #45474d;
    --tab-lo: #0c0d0e;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--bg);
    width: 100%;
  }

  /* Responsive wrapper: scales the whole 980x200 banner as one rigid unit,
     like a photo, instead of reflowing its layout at breakpoints. Nothing
     inside .banner changes at any size — every pixel-tuned value in this
     file (fonts, gaps, the seam, animation timing) stays exactly as
     verified. container-type + cqw let .banner compute its own scale
     factor from this wrapper's real rendered width, continuously, with no
     breakpoints. aspect-ratio reserves the right box before paint so nothing
     jumps. */
  /* whole banner is a click-through to the LaPatilla coverage — one <a>
     wrapping .banner-wrap, sized to fill it exactly, no dead corners. */
  .banner-link{
    display: block;
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
    text-decoration: none;
    color: inherit;
  }

  .banner-wrap{
    container-type: inline-size;
    width: 100%;
    aspect-ratio: 980 / 200;
    overflow: hidden;
    background: var(--bg);
    transition: filter 0.15s ease-out;
  }

  .banner-link:hover .banner-wrap{
    filter: brightness(1.03);
  }
  .banner-link:focus-visible .banner-wrap{
    outline: 3px solid #ff0400;
    outline-offset: 2px;
  }

  .banner{
    position: relative;
    width: 980px;
    height: 200px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Arial Narrow", Arial, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    transform: scale(calc(100cqw / 980px));
    transform-origin: top left;
  }

  /* credit, bottom-right, one line. Tight on purpose: the card row is
     centered in the 980px banner, leaving only ~94px of free margin to
     the right of the last card — Rory chose to keep that clock spacing
     untouched rather than free up more room for this, so the credit sits
     at the small end of legible. The logo itself is a recolored variant
     (lp-logo-light.png, not the original dark-charcoal wordmark): the
     grayscale "lapatilla" text was remapped to a light ink color while
     the red/green watermelon pixels were left alone, which is what makes
     it readable directly on --bg without a white pill behind it. */
  .credit{
    position: absolute;
    right: 5px;
    bottom: 8px;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 3px;
  }

  .credit-label{
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--label);
    white-space: nowrap;
  }

  .credit img{
    display: block;
    height: 9px;
    width: auto;
  }

  .title{
    align-self: flex-start;
    margin: 0 0 10px 94px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink);
    text-align: left;
  }

  .cta{
    align-self: flex-start;
    margin: 8px 0 0 94px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #ff0400;
  }

  .board{
    display: flex;
    align-items: flex-start;
    gap: 26px;
  }

  .unit{
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .digits{
    display: flex;
    gap: 6px;
  }

  .label{
    margin-top: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--label);
  }

  /* --- flip digit card, one character --- */
  .digit{
    position: relative;
    width: 76px;
    height: 128px;
    perspective: 440px;
    border-radius: 13px;
    background: var(--frame);
    box-shadow: 0 7px 12px rgba(0,0,0,0.6);
    /* overridden inline to a fast value during the page-load cascade
       (see script), then cleared so normal per-second ticks fall at the
       mechanical speed below. */
    --fall-duration: 0.32s;
  }

  /* thick black outer frame (the vector's most distinctive trait), then a
     thin lighter bevel ring just inside it tracing the rounded corners */
  .digit::before{
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), inset 0 0 0 1px rgba(255,255,255,0.05);
    z-index: 7;
    pointer-events: none;
  }

  /* ONE static face, showing the CURRENT value, full card — no top/bottom
     split content. Physically the seam is just a line printed across a
     single card; it never needs two independently-clipped copies of the
     glyph. That's also what makes desync impossible: one element, one
     text, always. */
  .digit .face{
    position: absolute;
    inset: 3px;
    border-radius: 10px;
    overflow: hidden;
    background: linear-gradient(180deg, var(--card-hi) 0%, var(--card-lo) 100%);
  }

  .digit .face span,
  .digit .leaf-front span,
  .digit .leaf-back span{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 76px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.02em;
  }

  /* experiment: only the digit "3" turns LaPatilla red, every other digit
     stays --ink black. Toggled via JS (span gets/loses this class) since
     it depends on the actual value shown, not a fixed position. */
  .digit .face span.is-three,
  .digit .leaf-front span.is-three,
  .digit .leaf-back span.is-three{
    color: #ff0400;
  }

  /* the seam: a solid black gap band, full width, drawn over everything */
  .digit .seam{
    position: absolute;
    left: -3px;
    right: -3px;
    top: 50%;
    height: 4px;
    margin-top: -2px;
    background: var(--frame);
    z-index: 6;
  }

  /* the hinge: two short dark tabs at the seam, bolted past the card's own
     edges, NOT a single bar crossing the tarjeta */
  .digit .tab{
    position: absolute;
    top: 50%;
    width: 15px;
    height: 13px;
    margin-top: -6.5px;
    border-radius: 3px;
    background: linear-gradient(180deg, var(--tab-hi) 0%, #202124 55%, var(--tab-lo) 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.12);
    z-index: 7;
  }
  .digit .tab.left{ left: -6px; }
  .digit .tab.right{ right: -6px; }

  /* EXPERIMENT (v2): a true double-sided card instead of one face that
     falls away to reveal a separate static layer underneath. .leaf is now
     a rotating GROUP (transform-style:preserve-3d) holding two faces —
     leaf-front (OLD value) and leaf-back (NEW value, pre-rotated 180deg
     so it reads right-side-up once the group has turned all the way
     over). The group rotates a full 0→-180deg: front visible the first
     half, edge-on at the midpoint, back visible the second half. Same
     physical object shows both values — nothing "pops in" underneath,
     which is what made the old version read as a reveal trick rather
     than a card actually turning over. */
  .digit .leaf{
    position: absolute;
    inset: 3px;
    border-radius: 10px;
    transform-origin: center;
    transform: rotateX(0deg);
    transform-style: preserve-3d;
    z-index: 5;
  }
  .digit .leaf-front,
  .digit .leaf-back{
    position: absolute;
    inset: 0;
    border-radius: 10px;
    overflow: hidden;
    backface-visibility: hidden;
    background: linear-gradient(180deg, var(--card-hi) 0%, var(--card-lo) 100%);
  }
  .digit .leaf-back{
    transform: rotateX(180deg);
  }
  .digit.flipping .leaf{
    animation: realFlip var(--fall-duration) linear forwards;
  }

  /* mechanical, not digital: a tiny anticipation lift (the card releasing
     from its catch) before gravity takes over — real split-flap leaves
     visibly "kick" back a couple degrees at the release, they don't just
     start smoothly accelerating from a dead stop. Fast steep ease-in
     through the first 90 (gravity), a slight catch/decelerate coming
     into the last few degrees (92-100%) so it settles into the stop
     instead of slamming dead flat — real hinged leaves have a hair of
     give right at the end, unlike the previous version's hard linear cut. */
  /* one continuous timing-function for the whole 8%->100% fall — every
     intermediate keyframe (50%, 92%) that also carries a
     animation-timing-function value creates a NEW segment boundary that
     resets easing for the NEXT stretch. Stacking the same steep ease-in
     on two consecutive segments double-backloads the motion (each
     segment re-crams its own progress into its own final moments), which
     is what produced the earlier "nothing happens, then it teleports"
     bug — measured via getComputedStyle(...).transform at fixed
     currentTime steps, not eyeballed. 50%/92% here only checkpoint
     box-shadow values now; they inherit the single curve set at 8%. */
  @keyframes realFlip{
    0%{ transform: rotateX(3deg); box-shadow: 0 2px 3px rgba(0,0,0,0.3); animation-timing-function: ease-out; }
    8%{ transform: rotateX(0deg); box-shadow: 0 3px 5px rgba(0,0,0,0.35); animation-timing-function: cubic-bezier(0.5, 0, 0.85, 0.35); }
    50%{ box-shadow: 0 22px 24px rgba(0,0,0,0.65); }
    92%{ box-shadow: 0 4px 6px rgba(0,0,0,0.4); }
    100%{ transform: rotateX(-180deg); box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
  }

  @media (prefers-reduced-motion: reduce){
    .digit.flipping .leaf{
      animation: none;
    }
  }

  .sr-only{
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>

<script>
(function(){
  // arranque real de la mesa de diálogo: 6 ago 2026, 4:32pm hora Venezuela (UTC-4)
  var START = new Date('2026-08-06T16:32:00-04:00').getTime();

  // experiment: the "3" always renders in LaPatilla red, every other
  // digit stays --ink black — depends on the value shown, so it's a class
  // toggle on the span rather than a fixed CSS rule.
  function setSpanValue(span, value){
    span.textContent = value;
    span.classList.toggle('is-three', value === '3');
  }

  function buildDigit(el, value){
    el.innerHTML =
      '<div class="face"><span></span></div>' +
      '<div class="leaf">' +
        '<div class="leaf-front"><span></span></div>' +
        '<div class="leaf-back"><span></span></div>' +
      '</div>' +
      '<div class="seam"></div>' +
      '<div class="tab left"></div>' +
      '<div class="tab right"></div>';
    setSpanValue(el.querySelector('.face span'), value);
    setSpanValue(el.querySelector('.leaf-front span'), value);
    setSpanValue(el.querySelector('.leaf-back span'), value);
    el.dataset.value = value;
  }

  // longer than the v1 320ms: this is now a full 180deg turn (was 90),
  // so it needs a bit more time to read as one continuous motion rather
  // than a rushed blur.
  var NORMAL_FALL_MS = 400;

  // durationMs lets the page-load cascade flip much faster than the normal
  // per-second fall; omit it for the regular mechanical speed.
  function setDigit(el, value, durationMs){
    value = String(value);
    var duration = durationMs || NORMAL_FALL_MS;

    if(!el.dataset.value){
      buildDigit(el, value);
      return;
    }
    if(el.dataset.value === value) return;

    // a previous flip on this card hasn't settled yet (e.g. the tab was
    // throttled in the background and several ticks landed at once): snap
    // straight to the new value instead of restarting mid-rotation.
    if(el.classList.contains('flipping')){
      clearTimeout(el._settleTimer);
      el.classList.remove('flipping');
      snapDigit(el, value);
      el.dataset.value = value;
      return;
    }

    el.style.setProperty('--fall-duration', (duration / 1000) + 's');

    // the leaf is now double-sided: front keeps showing OLD (it's what's
    // visible for the first half of the turn), back is pre-loaded with
    // NEW (visible once the turn passes 90deg). The static .face still
    // mirrors the new value underneath for the idle state after settle.
    setSpanValue(el.querySelector('.leaf-front span'), el.dataset.value);
    setSpanValue(el.querySelector('.leaf-back span'), value);
    setSpanValue(el.querySelector('.face span'), value);

    void el.offsetWidth; // restart animation
    el.classList.add('flipping');

    el.dataset.value = value;

    el._settleTimer = setTimeout(function(){
      el.classList.remove('flipping');
      snapDigit(el, value);
    }, duration + 20);
  }

  // keeps face + both leaf faces in sync so the card is consistent at
  // rest — leaf-front is what's actually visible when idle (the group
  // sits flat at rotateX(0), front-side forward), so it must carry the
  // current value too, not just .face.
  function snapDigit(el, value){
    setSpanValue(el.querySelector('.face span'), value);
    setSpanValue(el.querySelector('.leaf-front span'), value);
    setSpanValue(el.querySelector('.leaf-back span'), value);
  }

  function setUnit(unitEl, num, digits, durationMs){
    var str = String(num).padStart(digits, '0');
    var cards = unitEl.querySelectorAll('.digit');
    for(var i = 0; i < cards.length; i++){
      setDigit(cards[i], str[i], durationMs);
    }
  }

  var board = document.getElementById('board');
  var daysEl = board.querySelector('[data-unit="days"]');
  var hoursEl = board.querySelector('[data-unit="hours"]');
  var minutesEl = board.querySelector('[data-unit="minutes"]');
  var secondsEl = board.querySelector('[data-unit="seconds"]');

  var statusEl = document.getElementById('board-status');
  var lastStatusMinute = -1;

  function tick(){
    var elapsed = Math.floor((Date.now() - START) / 1000);
    var days = Math.floor(elapsed / 86400);
    var hours = Math.floor((elapsed % 86400) / 3600);
    var minutes = Math.floor((elapsed % 3600) / 60);
    var seconds = elapsed % 60;

    setUnit(daysEl, days, 3);
    setUnit(hoursEl, hours, 2);
    setUnit(minutesEl, minutes, 2);
    setUnit(secondsEl, seconds, 2);

    var totalMinutes = Math.floor(elapsed / 60);
    if(totalMinutes !== lastStatusMinute){
      lastStatusMinute = totalMinutes;
      statusEl.textContent = 'Mesa de diálogo en Venezuela activa desde hace ' +
        days + ' días, ' + hours + ' horas y ' + minutes + ' minutos.';
    }
  }

  function pad(n, digits){
    return String(n).padStart(digits, '0');
  }

  function currentTarget(){
    var elapsed = Math.floor((Date.now() - START) / 1000);
    return {
      days: Math.floor(elapsed / 86400),
      hours: Math.floor((elapsed % 86400) / 3600),
      minutes: Math.floor((elapsed % 3600) / 60),
      seconds: elapsed % 60
    };
  }

  // page-load cascade: every card starts at 0 and spins through a burst of
  // quick, staggered flips (left to right) before landing on the real
  // current value, then normal per-second ticking takes over. Purely a
  // decorative "catching up" reveal — the intermediate digits shown during
  // the spin are not a literal count-up (days could be large), just motion.
  var SPIN_STEPS = 6;
  var SPIN_STEP_MS = 100;
  var CASCADE_STAGGER_MS = 70;

  function randomDigitExcept(exclude){
    var d;
    do { d = String(Math.floor(Math.random() * 10)); } while(d === exclude);
    return d;
  }

  function burstCard(el, finalValue, startDelay){
    setTimeout(function(){
      var i = 0;
      function step(){
        if(i < SPIN_STEPS - 1){
          setDigit(el, randomDigitExcept(el.dataset.value), SPIN_STEP_MS);
          i++;
          setTimeout(step, SPIN_STEP_MS + 20);
        } else {
          setDigit(el, finalValue, SPIN_STEP_MS);
        }
      }
      step();
    }, startDelay);
  }

  function startNormalTicking(){
    tick();
    setInterval(tick, 1000);
  }

  function runIntro(){
    var t = currentTarget();
    var targets = (pad(t.days, 3) + pad(t.hours, 2) + pad(t.minutes, 2) + pad(t.seconds, 2)).split('');
    var allCards = Array.prototype.slice.call(board.querySelectorAll('.digit'));

    allCards.forEach(function(card){ buildDigit(card, '0'); });
    allCards.forEach(function(card, idx){
      burstCard(card, targets[idx], idx * CASCADE_STAGGER_MS);
    });

    var totalIntroMs = (allCards.length - 1) * CASCADE_STAGGER_MS + SPIN_STEPS * (SPIN_STEP_MS + 20) + 100;
    setTimeout(function(){
      allCards.forEach(function(card){ card.style.removeProperty('--fall-duration'); });
      startNormalTicking();
    }, totalIntroMs);
  }

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion){
    startNormalTicking();
  } else {
    runIntro();
  }
})();
</script>
